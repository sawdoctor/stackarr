services:
  shelfmark-ebooks:
    image: ghcr.io/calibrain/shelfmark:v1.3.14
    container_name: shelfmark-ebooks
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London

      SEARCH_PAGE_TITLE: Shelfmark Ebooks
      SUPPORTED_FORMATS: epub,pdf
      BOOK_LANGUAGE: en

      BOOKS_OUTPUT_MODE: folder
      INGEST_DIR: /books
      FILE_ORGANIZATION: organize

      # Copy to GDrive first, then clean up only this completed Usenet job.
      PROWLARR_USENET_ACTION: move
      INFINITYDYSK_EXACT_CLEANUP: "false"

      # Search only through the existing Prowlarr instance.
      PROWLARR_ENABLED: "true"
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      PROWLARR_AUTO_EXPAND: "false"

      # InfiniDysk presents its existing SAB-compatible API to Shelfmark.
      PROWLARR_USENET_CLIENT: sabnzbd
      SABNZBD_URL: http://sabnzbd-ebooks:8080
      SABNZBD_API_KEY: ${SABNZBD_API_KEY}

      # Existing InfiniDysk ebook/manual category.
      SABNZBD_CATEGORY: books

      # Repair missing EPUB series metadata after successful imports.
      CUSTOM_SCRIPT: /config/epub-series-fix.py
      CUSTOM_SCRIPT_PATH_MODE: absolute
      CUSTOM_SCRIPT_JSON_PAYLOAD: "true"

    ports:
      - "8086:8084"

    volumes:
      # Completely separate Shelfmark config.
      - /home/sawdoctor/docker/shelfmark-ebooks/config:/config
      - ./patches/base_handler.py:/app/shelfmark/download/clients/base_handler.py:ro

      # Real physical ebook destination: existing GDrive/rclone mount.
      - /mnt/media/ebooks:/books

      # Real SABnzbd completed downloads shared with Shelfmark.
      - /home/sawdoctor/docker/sabnzbd/downloads:/downloads:rw

      # InfiniDysk is READ-ONLY globally.
      # Required so completed symlinks can resolve their /mnt/nzbdav/.ids targets.
      - /mnt/nzbdav/.ids:/mnt/nzbdav/.ids:ro

      # The ONLY writable InfiniDysk area exposed to Shelfmark:
      # completed uncategorized symlinks.
      - /mnt/nzbdav/completed-symlinks/uncategorized:/mnt/nzbdav/completed-symlinks/uncategorized:rw

    networks:
      - media-core
      - web-network

networks:
  media-core:
    external: true

  web-network:
    external: true
